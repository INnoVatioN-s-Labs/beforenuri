name: CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -eu
          for name in DB_URL DB_USERNAME DB_PASSWORD MONGODB_URI; do
            if [ -z "$(printenv "$name")" ]; then
              echo "Missing required deployment secret: $name" >&2
              exit 1
            fi
          done

      - name: Build deployment image
        run: docker build -t t4lk:latest .

      - name: Save Docker image
        run: docker save t4lk:latest -o t4lk-image.tar
        
      - name: Fix image archive permissions
        run: chmod 644 t4lk-image.tar

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: t4lk-image.tar
          target: /home/${{ secrets.EC2_USER }}/t4lk-deploy

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,MONGODB_URI
          script: |
            set -eu
            : "${DB_URL:?Missing DB_URL}"
            : "${DB_USERNAME:?Missing DB_USERNAME}"
            : "${DB_PASSWORD:?Missing DB_PASSWORD}"
            : "${MONGODB_URI:?Missing MONGODB_URI}"

            mkdir -p ~/t4lk-deploy
            cd ~/t4lk-deploy
            # 새 이미지 로드 전 디스크 확보: 기존 컨테이너 제거 후 미사용 이미지/캐시 정리
            # (--volumes 미지정이라 DB 등 볼륨 데이터는 보존)
            docker rm -f t4lk || true
            docker system prune -af || true
            docker load -i t4lk-image.tar
            {
              printf 'DB_URL=%s\n' "$DB_URL"
              printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
              printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
              printf 'MONGODB_URI=%s\n' "$MONGODB_URI"
            } > .env
            docker run -d --name t4lk --restart unless-stopped --env-file .env -p 8080:8080 t4lk:latest
            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:8080/health >/dev/null; then
                docker ps --filter name=t4lk
                exit 0
              fi
              sleep 5
            done

            docker ps -a --filter name=t4lk
            docker logs --tail=200 t4lk
            exit 1
